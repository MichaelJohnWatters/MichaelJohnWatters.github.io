[package]
name = "night-drive"
version = "0.1.0"
edition = "2021"
description = "Night Drive — the arcade game on the garage monitor (loaded from the floppy)"

[dependencies]
macroquad = "0.4"

# small wasm: optimise for size + link-time optimisation
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
