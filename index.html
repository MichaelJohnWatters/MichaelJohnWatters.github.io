<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Michael Watters</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <meta
      name="description"
      content="Michael Watters — Scala engineer, Belfast. A 3D night-garage portfolio: sit at the desk, read the CV, talk to the terminal, explore."
    />
    <meta property="og:title" content="Michael Watters — the night garage" />
    <meta
      property="og:description"
      content="A portfolio you can walk around in. Sit at the desk, read the CV on a retro monitor, chat with the terminal. Built with React Three Fiber."
    />
    <meta property="og:image" content="https://michaeljohnwatters.github.io/og.png" />
    <meta property="og:url" content="https://michaeljohnwatters.github.io/" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <!-- static loading screen: visible before ANY js runs; App fades it out
         once the scene is live -->
    <div id="boot">
      <div id="boot-inner">
        <div id="boot-name">michael watters</div>
        <div id="boot-sub">opening the garage<span id="boot-dots"></span></div>
      </div>
    </div>
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9000000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a0f;
        transition: opacity 0.6s;
        font-family: 'SF Mono', ui-monospace, Menlo, monospace;
      }
      #boot.done {
        opacity: 0;
        pointer-events: none;
      }
      #boot-inner {
        text-align: center;
      }
      #boot-name {
        color: #e8e8f0;
        font-size: 22px;
        letter-spacing: 2px;
        margin-bottom: 10px;
      }
      #boot-sub {
        color: #e8b34b;
        font-size: 13px;
      }
      #boot-dots::after {
        content: '';
        animation: bootdots 1.2s steps(4) infinite;
      }
      @keyframes bootdots {
        0% { content: ''; }
        25% { content: '.'; }
        50% { content: '..'; }
        75% { content: '...'; }
      }
    </style>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
